<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - Puffé</title>
    
    <!-- Memanggil Google Fonts dengan benar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE STYLE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* WAJIB PUTIH SOLID AGAR TIDAK TEMBUS TRANSPARAN DI DALAM IFRAME */
            background-color: #ffffff !important;
            padding: 40px 5%;
            color: #4a5568;
            line-height: 1.7;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CONTAINER UTAMA */
        .contact-container {
            max-width: 900px;
            margin: 20px auto;
            background: #ffffff;
            border: 2px solid rgba(255, 117, 151, 0.15);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(168, 68, 84, 0.12), 
                        0 5px 15px rgba(0, 0, 0, 0.04);
            animation: fadeInUp 0.8s ease-out;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 25px;
            }
        }

        /* KOLOM KIRI */
        .info-section h1 {
            font-size: 28px;
            font-weight: 700;
            color: #A84454;
            margin-bottom: 12px;
        }

        .info-section .intro-text {
            font-size: 13.5px;
            color: #64748b;
            margin-bottom: 30px;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .detail-item {
            background: #fff8f9;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 117, 151, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: inset 0 1px 3px rgba(255, 117, 151, 0.02);
        }

        .detail-item span {
            font-size: 20px;
        }

        .detail-item p {
            font-size: 13.5px
